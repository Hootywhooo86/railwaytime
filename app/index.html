<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b16">
<title>Railway Time</title>
<meta name="description" content="Railway Time: a pixel clock app with alarms, world clock, timers, stopwatch and bedtime.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b16;
    --panel:#141428;
    --line:#2a2a4a;
    --key:#1f1f3a;
    --teal:#2dd4bf;
    --teal-deep:#0e7490;
    --orange:#ff9f1c;
    --pink:#ff5d8f;
    --ink:#f4f1ff;
    --muted:#9a97b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(45,212,191,.07) 1px,transparent 1px);background-size:22px 22px}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .px{font-family:'Press Start 2P',monospace}
  .app{max-width:560px;margin:0 auto;padding:12px 14px 110px;position:relative}
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Press Start 2P',monospace;font-size:11px}
  .logo i{width:28px;height:28px;background:var(--teal);display:grid;place-items:center;font-style:normal;font-size:14px;box-shadow:0 3px 0 var(--teal-deep)}
  .iconbtn{font-family:'Press Start 2P',monospace;font-size:8px;background:var(--key);border:none;padding:9px 10px;box-shadow:0 3px 0 #000}
  .iconbtn.on{background:var(--teal);color:var(--bg);box-shadow:0 3px 0 var(--teal-deep)}
  .view{display:none}.view.on{display:block}
  .card{background:var(--panel);border:3px solid var(--line);padding:14px;box-shadow:6px 6px 0 #000;margin-bottom:14px}
  h2{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--teal);margin-bottom:12px;line-height:1.6}
  .muted{color:var(--muted)}
  .pxbtn{font-family:'Press Start 2P',monospace;font-size:9px;padding:12px 14px;background:var(--key);border:none;box-shadow:0 4px 0 #000}
  .pxbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
  .pxbtn.go{background:var(--teal);color:var(--bg);box-shadow:0 4px 0 var(--teal-deep)}
  .pxbtn.warn{background:var(--pink);color:var(--bg);box-shadow:0 4px 0 #9d174d}
  .pxbtn.orange{background:var(--orange);color:var(--bg);box-shadow:0 4px 0 #a05e00}
  .pxbtn:disabled{opacity:.4}
  input,select{background:var(--bg);border:3px solid var(--line);color:var(--ink);font-size:15px;padding:9px 10px;font-family:'Inter',sans-serif;width:100%;border-radius:0}
  input:focus,select:focus{outline:none;border-color:var(--teal)}
  input[type=time]{color-scheme:dark;font-family:'Press Start 2P',monospace;font-size:16px}
  label.f{display:block;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);margin:12px 0 6px}
  /* bottom nav */
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:8;padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{background:none;border:none;padding:10px 0 12px;font-family:'Press Start 2P',monospace;font-size:7px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:7px}
  .tabs button span{font-size:18px;font-family:system-ui}
  .tabs button.on{color:var(--teal)}
  .tabs button.on span{transform:translateY(-2px)}
  /* clock */
  .bigclock{text-align:center;padding:10px 0 4px}
  .bigclock .t{font-family:'Press Start 2P',monospace;font-size:clamp(34px,11vw,56px);letter-spacing:2px;text-shadow:0 5px 0 #1a1a33,5px 0 0 #1a1a33}
  .bigclock .t small{font-size:.32em;color:var(--teal);margin-left:6px}
  .bigclock .s{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--orange);margin-top:6px}
  .bigclock .d{color:var(--muted);margin-top:12px;font-size:14px}
  canvas#analog{display:block;margin:6px auto 4px;width:220px;height:220px;image-rendering:pixelated}
  .next{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
  .next b{color:var(--teal)}
  .city{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
  .city:last-child{border-bottom:none}
  .city .nm{flex:1;min-width:0}
  .city .nm b{display:block;font-size:15px}
  .city .nm span{font-size:12px;color:var(--muted)}
  .city .tm{font-family:'Press Start 2P',monospace;font-size:15px;text-align:right}
  .city .tm small{display:block;font-size:7px;color:var(--muted);margin-top:6px}
  .city .x{background:none;border:none;color:var(--muted);font-size:16px;padding:4px}
  .addrow{display:flex;gap:8px;margin-top:10px}
  /* alarms */
  .alarm{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:14px 0;border-bottom:2px dashed var(--line)}
  .alarm:last-child{border-bottom:none}
  .alarm .tm{font-family:'Press Start 2P',monospace;font-size:24px;cursor:pointer}
  .alarm .tm small{font-size:9px;color:var(--muted);margin-left:4px}
  .alarm.off .tm{color:var(--muted)}
  .alarm .meta{font-size:13px;color:var(--muted);grid-column:1/2}
  .alarm .meta b{color:var(--ink);font-weight:600}
  .alarm .acts{grid-column:1/-1;display:none;gap:12px;flex-wrap:wrap;padding-top:8px}
  .alarm.open .acts{display:flex;flex-direction:column}
  .days{display:flex;gap:5px}
  .days button{width:34px;height:34px;background:var(--bg);border:3px solid var(--line);font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted)}
  .days button.on{background:var(--teal);border-color:var(--teal-deep);color:var(--bg)}
  .tog{width:52px;height:28px;background:var(--bg);border:3px solid var(--line);position:relative;flex:0 0 auto;align-self:center}
  .tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--muted);transition:left .15s}
  .tog.on{background:var(--teal-deep);border-color:var(--teal)}
  .tog.on::after{left:26px;background:var(--teal)}
  .rowflex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:88px;width:60px;height:60px;background:var(--teal);color:var(--bg);font-size:28px;border:none;box-shadow:0 5px 0 var(--teal-deep);z-index:7;display:none}
  .fab.show{display:block}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;line-height:1.7}
  .empty .px{display:block;color:var(--teal);font-size:10px;margin-bottom:10px}
  /* timer */
  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .dial{display:flex;justify-content:center;gap:6px;align-items:center;font-family:'Press Start 2P',monospace;margin:6px 0 14px}
  .dial input{width:74px;text-align:center;font-family:'Press Start 2P',monospace;font-size:20px;padding:12px 4px}
  .dial span{font-size:20px;color:var(--muted)}
  .timer{border:3px solid var(--line);background:var(--bg);padding:14px;margin-top:12px;position:relative;overflow:hidden}
  .timer .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--teal);transition:width .25s linear}
  .timer.ringing{border-color:var(--pink);animation:flash .6s steps(1) infinite}
  @keyframes flash{50%{background:#2a0f1c}}
  .timer .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .timer .rem{font-family:'Press Start 2P',monospace;font-size:clamp(24px,8vw,34px);margin-bottom:12px}
  .timer.paused .rem{color:var(--muted)}
  /* stopwatch */
  .sw{font-family:'Press Start 2P',monospace;font-size:clamp(30px,10vw,48px);text-align:center;padding:24px 0 8px}
  .sw small{font-size:.5em;color:var(--teal)}
  .swbtns{display:flex;justify-content:center;gap:12px;margin:14px 0 6px}
  .swbtns .pxbtn{min-width:120px;padding:16px}
  .laps{list-style:none;font-size:14px}
  .laps li{display:grid;grid-template-columns:60px 1fr 1fr;padding:9px 4px;border-bottom:2px dashed var(--line);font-variant-numeric:tabular-nums}
  .laps li span:nth-child(2),.laps li span:nth-child(3){text-align:right;font-family:'Press Start 2P',monospace;font-size:10px}
  .laps li.best{color:var(--teal)} .laps li.worst{color:var(--pink)}
  /* bedtime */
  .sleepbar{display:flex;height:16px;background:var(--bg);border:3px solid var(--line);margin:10px 0 6px;position:relative}
  .sleepbar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#6d28d9,var(--teal))}
  .sleepinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .stat{font-family:'Press Start 2P',monospace;font-size:18px;color:var(--orange);text-align:center;margin:14px 0 4px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .grid2 input[type=time]{font-size:13px;padding:10px 6px;min-width:0}
  /* ring overlay */
  .ring{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:18px}
  .ring.show{display:flex}
  .ring .bell{font-size:72px;animation:shake .3s steps(2) infinite}
  @keyframes shake{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}
  .ring .t{font-family:'Press Start 2P',monospace;font-size:clamp(30px,12vw,52px)}
  .ring .l{font-size:18px;color:var(--muted)}
  .ring .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .ring .btns .pxbtn{font-size:12px;padding:20px 26px}
  .banner{background:#2a1f0b;border:3px solid var(--orange);color:var(--orange);padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
  .banner .pxbtn{flex:0 0 auto}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(200px);background:var(--teal);color:var(--bg);font-family:'Press Start 2P',monospace;font-size:10px;padding:12px 16px;box-shadow:0 4px 0 var(--teal-deep);transition:transform .25s;z-index:40;max-width:92vw;line-height:1.5}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(5,5,12,.85);display:none;align-items:flex-end;justify-content:center;z-index:25}
  .modal.open{display:flex}
  .sheet{background:var(--panel);border:3px solid var(--line);border-bottom:none;width:100%;max-width:560px;padding:18px 16px 26px;max-height:92dvh;overflow-y:auto}
  .sheet .btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i>⏰</i>RAILWAY TIME</div>
    <div class="rowflex">
      <button class="iconbtn" id="fmtBtn" title="12/24-hour">24H</button>
      <button class="iconbtn" id="wakeBtn" title="Keep screen awake">☀ AWAKE</button>
    </div>
  </header>
  <div id="banners"></div>

  <!-- ALARM -->
  <section class="view" id="v-alarm">
    <div class="card"><div class="next" id="nextAlarm" style="margin:0"></div></div>
    <div class="card" id="alarmList"></div>
  </section>

  <!-- CLOCK -->
  <section class="view" id="v-clock">
    <div class="card">
      <canvas id="analog" width="88" height="88"></canvas>
      <div class="bigclock"><div class="t" id="bigT"></div><div class="s" id="bigS"></div><div class="d" id="bigD"></div></div>
    </div>
    <div class="card">
      <h2>🌍 WORLD CLOCK</h2>
      <div id="cities"></div>
      <div class="addrow">
        <input id="tzSearch" list="tzList" placeholder="Add a city (e.g. Tokyo, London)" autocomplete="off">
        <datalist id="tzList"></datalist>
        <button class="pxbtn go" id="tzAdd">ADD</button>
      </div>
    </div>
  </section>

  <!-- TIMER -->
  <section class="view" id="v-timer">
    <div class="card">
      <h2>⏳ NEW TIMER</h2>
      <div class="dial"><input id="tH" type="number" min="0" max="99" value="0" aria-label="Hours"><span>:</span><input id="tM" type="number" min="0" max="59" value="5" aria-label="Minutes"><span>:</span><input id="tS" type="number" min="0" max="59" value="0" aria-label="Seconds"></div>
      <input id="tLabel" placeholder="Label (optional) — e.g. Pasta">
      <div class="presets" style="margin-top:12px" id="presets"></div>
      <button class="pxbtn go" id="tStart" style="width:100%;margin-top:14px;padding:16px">▶ START</button>
    </div>
    <div id="timers"></div>
  </section>

  <!-- STOPWATCH -->
  <section class="view" id="v-sw">
    <div class="card">
      <div class="sw" id="swT">00:00<small>.00</small></div>
      <div class="swbtns"><button class="pxbtn" id="swLap">LAP</button><button class="pxbtn go" id="swGo">START</button></div>
      <ul class="laps" id="laps"></ul>
    </div>
  </section>

  <!-- BEDTIME -->
  <section class="view" id="v-bed">
    <div class="card">
      <h2>🌙 BEDTIME SCHEDULE</h2>
      <div class="grid2">
        <div><label class="f">BEDTIME</label><input type="time" id="bedT"></div>
        <div><label class="f">WAKE UP</label><input type="time" id="wakeT"></div>
      </div>
      <label class="f">DAYS</label>
      <div class="days" id="bedDays"></div>
      <div class="stat" id="sleepLen"></div>
      <div class="sleepbar"><i id="sleepFill"></i></div>
      <div class="sleepinfo"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span></div>
      <label class="f">WIND-DOWN REMINDER</label>
      <select id="bedRemind"><option value="0">Off</option><option value="15">15 min before bed</option><option value="30">30 min before bed</option><option value="60">1 hour before bed</option></select>
      <div class="rowflex" style="justify-content:space-between;margin-top:16px">
        <span>⏰ Wake-up alarm</span><button class="tog" id="bedAlarmTog" aria-label="Wake-up alarm"></button>
      </div>
      <div class="rowflex" style="justify-content:space-between;margin-top:12px">
        <span>🌙 Bedtime schedule</span><button class="tog" id="bedTog" aria-label="Bedtime schedule"></button>
      </div>
    </div>
    <div class="card">
      <h2>📈 THIS WEEK</h2>
      <div id="bedLog" class="muted" style="font-size:14px;line-height:1.8"></div>
      <button class="pxbtn" id="bedSlept" style="margin-top:12px">💤 GOING TO BED NOW</button>
    </div>
  </section>
</div>

<button class="fab" id="fab" aria-label="Add alarm">+</button>

<nav class="tabs">
  <button data-v="alarm"><span>⏰</span>ALARM</button>
  <button data-v="clock"><span>🕰</span>CLOCK</button>
  <button data-v="timer"><span>⏳</span>TIMER</button>
  <button data-v="sw"><span>⏱</span>WATCH</button>
  <button data-v="bed"><span>🌙</span>BEDTIME</button>
</nav>

<div class="modal" id="editModal">
  <div class="sheet">
    <h2 id="editTitle">NEW ALARM</h2>
    <input type="time" id="eTime" style="font-size:28px;padding:16px;text-align:center">
    <label class="f">REPEAT</label>
    <div class="days" id="eDays"></div>
    <label class="f">LABEL</label>
    <input id="eLabel" placeholder="e.g. Work">
    <label class="f">SOUND</label>
    <div class="rowflex"><select id="eSound" style="flex:1"></select><button class="pxbtn" id="ePreview">▶</button></div>
    <label class="f">SNOOZE LENGTH</label>
    <select id="eSnooze"><option value="5">5 min</option><option value="9">9 min</option><option value="10" selected>10 min</option><option value="15">15 min</option><option value="20">20 min</option></select>
    <div class="rowflex" style="justify-content:space-between;margin-top:14px"><span>📳 Vibrate</span><button class="tog" id="eVibe" aria-label="Vibrate"></button></div>
    <div class="btns"><button class="pxbtn warn" id="eDelete">DELETE</button><button class="pxbtn" id="eCancel">CANCEL</button><button class="pxbtn go" id="eSave">SAVE</button></div>
  </div>
</div>

<div class="ring" id="ring">
  <div class="bell">⏰</div>
  <div class="t" id="ringT"></div>
  <div class="l" id="ringL"></div>
  <div class="btns"><button class="pxbtn orange" id="ringSnooze">SNOOZE</button><button class="pxbtn go" id="ringStop">STOP</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= Basics ================= */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('rt.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('rt.' + k, JSON.stringify(v)); } catch {} }
};
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
const pad = n => String(n).padStart(2, '0');
const DAYS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'], DAYNAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let h24 = store.get('h24', false);
function hm(h, m, withSuffix = true){
  if (h24) return `${pad(h)}:${pad(m)}`;
  const s = h < 12 ? 'AM' : 'PM', hh = h % 12 || 12;
  return withSuffix ? `${hh}:${pad(m)}<small>${s}</small>` : `${hh}:${pad(m)} ${s}`;
}
function dur(ms){
  const m = Math.ceil(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return [d ? d + 'd' : '', h ? h + 'h' : '', (mm || (!d && !h)) ? mm + 'm' : ''].filter(Boolean).join(' ');
}

/* ================= Sound (synthesized chiptunes) ================= */
let ac = null;
function audio(){ if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
document.addEventListener('pointerdown', () => { try { audio(); } catch {} }, { once: true });
const SOUNDS = {
  'Pixel chime': [[784, .15], [988, .15], [1175, .15], [1568, .35], [0, .4]],
  'Station bell': [[1319, .5], [0, .1], [1319, .5], [0, .6]],
  'Train whistle': [[587, .9, 'saw'], [0, .15], [587, .4, 'saw'], [0, .6]],
  'Classic beep': [[1000, .12], [0, .08], [1000, .12], [0, .08], [1000, .12], [0, .08], [1000, .12], [0, .5]],
  'Sunrise': [[523, .25, 'tri'], [659, .25, 'tri'], [784, .25, 'tri'], [1047, .5, 'tri'], [0, .5]],
  'Rooster (8-bit)': [[700, .1], [900, .1], [1200, .25], [1000, .3], [800, .4], [0, .5]]
};
let loopStop = null;
function playOnce(name, gainBoost = 1){
  const ctx = audio(), seq = SOUNDS[name] || SOUNDS['Pixel chime'];
  let t = ctx.currentTime + 0.02;
  seq.forEach(([f, d, type]) => {
    if (f){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type === 'saw' ? 'sawtooth' : type === 'tri' ? 'triangle' : 'square';
      o.frequency.value = f;
      if (type === 'saw') o.frequency.linearRampToValueAtTime(f * 0.94, t + d);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12 * gainBoost, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + d + 0.02);
    }
    t += d;
  });
  return (t - ctx.currentTime) * 1000;
}
function startLoop(name){
  stopLoop(); let alive = true, n = 0;
  const go = () => { if (!alive) return; const ms = playOnce(name, Math.min(1 + n++ * 0.15, 3)); setTimeout(go, ms); };
  try { go(); } catch {}
  loopStop = () => { alive = false; };
}
function stopLoop(){ if (loopStop) loopStop(); loopStop = null; if (navigator.vibrate) navigator.vibrate(0); }

/* ================= Notifications & wake lock ================= */
async function notify(title, body){
  try {
    if (Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(title, { body, tag: 'railwaytime', renotify: true, requireInteraction: true, icon: 'icon.svg' });
    else new Notification(title, { body });
  } catch {}
}
function banners(){
  const out = [];
  if ('Notification' in window && Notification.permission === 'default') out.push(`<div class="banner"><span>Allow notifications so alarms and timers can alert you when this tab is in the background.</span><button class="pxbtn orange" id="askNotif">ALLOW</button></div>`);

function tick(){

  $('bigT').innerHTML = hm(h, m); $('bigS').textContent = pad(s);

function drawAnalog(now){
  // Pixel railway clock drawn on an 88x88 grid, scaled up crisp.
  const c = $('analog'), x = c.getContext('2d'), N = 88, C = 44;
  x.clearRect(0, 0, N, N);
  const dot = (px, py, col, sz = 1) => { x.fillStyle = col; x.fillRect(Math.round(px - sz / 2), Math.round(py - sz / 2), sz, sz); };
  for (let a = 0; a < 360; a += 1.2){ const r = a * Math.PI / 180; dot(C + Math.cos(r) * 41, C + Math.sin(r) * 41, '#2a2a4a', 3); }
  x.fillStyle = '#f4f1ff'; x.beginPath(); x.arc(C, C, 38, 0, Math.PI * 2); x.fill();
  for (let i = 0; i < 60; i++){
    const r = i / 60 * Math.PI * 2, big = i % 5 === 0;
    for (let k = big ? 30 : 34; k <= 36; k++) dot(C + Math.sin(r) * k, C - Math.cos(r) * k, '#0b0b16', big ? 2 : 1);
  }
  const hand = (frac, len, w, col, tail = 0) => { const r = frac * Math.PI * 2; for (let k = -tail; k <= len; k += 0.5) dot(C + Math.sin(r) * k, C - Math.cos(r) * k, col, w); };
  const ms = now.getMilliseconds(), s = now.getSeconds(), m = now.getMinutes(), h = now.getHours() % 12;
  hand((h + m / 60) / 12, 20, 4, '#0b0b16', 4);
  hand((m + s / 60) / 60, 30, 3, '#0b0b16', 5);
  // Swiss railway style: the second hand sweeps in 58.5s and pauses at 12.
  const sweep = Math.min((s + ms / 1000) / 58.5, 1);
  hand(sweep, 26, 1, '#ff5d8f', 8);
  const r = sweep * Math.PI * 2; x.fillStyle = '#ff5d8f'; x.fillRect(Math.round(C + Math.sin(r) * 26) - 3, Math.round(C - Math.cos(r) * 26) - 3, 6, 6);
  dot(C, C, '#ff5d8f', 4);
}

dayButtons($('bedDays'), bedDays, () => { bed.days = bedDays; saveBed(); });
function saveBed(){ store.set('bed', bed); renderBed(); syncBedAlarm(); }
$('bedT').onchange = () => { bed.bed = $('bedT').value || bed.bed; saveBed(); };
$('wakeT').onchange = () => { bed.wake = $('wakeT').value || bed.wake; saveBed(); };
$('bedRemind').onchange = () => { bed.remind = +$('bedRemind').value; saveBed(); };
$('bedAlarmTog').onclick = () => { bed.alarm = !bed.alarm; saveBed(); };
$('bedTog').onclick = () => { bed.on = !bed.on; saveBed(); toast(bed.on ? 'BEDTIME SCHEDULE ON' : 'BEDTIME OFF'); };
$('bedSlept').onclick = () => {
  const now = new Date(), [bh, bm] = bed.bed.split(':').map(Number), target = bh * 60 + bm, cur = now.getHours() * 60 + now.getMinutes();
  const off = Math.min(Math.abs(cur - target), 1440 - Math.abs(cur - target));
  bed.log = bed.log.filter(l => Date.now() - l.bed < 14 * 864e5); bed.log.push({ bed: Date.now(), wake: null, onTime: off <= 30 });
  saveBed(); toast(off <= 30 ? 'ON TIME! +15 XP · SWEET DREAMS' : 'SWEET DREAMS 🌙');
  setWake(true);
};
function logWake(){ const l = bed.log[bed.log.length - 1]; if (l && !l.wake && Date.now() - l.bed < 16 * 3600e3){ l.wake = Date.now(); store.set('bed', bed); renderBed(); } }
function checkBedReminder(now){
  if (!bed.on || !bed.remind) return;
  const [bh, bm] = bed.bed.split(':').map(Number), t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), bh, bm).getTime() - bed.remind * 60000;
  if (!bed.days.includes(new Date(t + bed.remind * 60000).getDay())) return;
  const key = 'remind.' + new Date(t).toDateString();
  if (now >= t && now - t < 5 * 60000 && !store.get(key, false)){
    store.set(key, true);
    try { playOnce('Station bell'); } catch {}
    notify('🌙 Time to wind down', `Bedtime at ${hm(bh, bm, false)}. Screens down, lights low.`);
    toast(`WIND DOWN: BED AT ${hm(bh, bm, false)}`);
  }
}

/* ================= Main loop ================= */
function checkAlarms(){
  const now = Date.now(); let changed = false;
  alarms.forEach(a => {
    if (!a.on || !a.next) return;
    if (now >= a.next){
      const late = now - a.next;
      if (late > 10 * 60000){ toast(`MISSED ALARM ${hm(a.h, a.m, false)}`); a.snoozeUntil = 0; if (!a.days.length) a.on = false; changed = true; return; }
      if (!ringing){ a.next = null; ring('alarm', a, hm(new Date().getHours(), new Date().getMinutes()), a.label || 'Alarm'); }
    }
  });
  if (changed) saveAlarms();
}
let lastSec = -1;
function loop(){
  const now = new Date();
  if (now.getSeconds() !== lastSec){ lastSec = now.getSeconds(); checkAlarms(); checkBedReminder(now); if (lastSec === 0){ renderNext(); if ($('v-alarm').classList.contains('on')) renderAlarms(); } }
  if ($('v-clock').classList.contains('on')) tick();
  if ($('v-sw').classList.contains('on')) renderSw();
  tickTimers();
}
// rAF for smooth display when visible; interval keeps alarms firing when the tab is hidden.
(function raf(){ loop(); requestAnimationFrame(raf); })();
setInterval(loop, 1000);

/* ================= Tabs ================= */
function show(v){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $('fab').classList.toggle('show', v === 'alarm');
  store.set('tab', v); lastCityMinute = -1;
  if (v === 'alarm') renderAlarms();
  if (v === 'sw'){ renderSw(); renderLaps(); }
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
const nextEl = document.createElement('div'); nextEl.className = 'next'; nextEl.id = 'clockNext'; document.querySelector('#v-clock .card').appendChild(nextEl);
alarms.forEach(a => { if (a.on && !a.next) a.next = nextFire(a); });
// Alarms whose time passed while the app was closed: report instead of ringing late.
checkAlarms();
saveAlarms(); renderTimers(); renderBed(); banners(); show(store.get('tab', 'clock'));
if (store.get('wake', false)) setWake(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
