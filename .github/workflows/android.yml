name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk railwaytime.apk
      - uses: actions/upload-artifact@v4
        with:
          name: railwaytime-apk
          path: android/railwaytime.apk
      # One fixed link to install from on the phone.
      - name: Publish to the "app-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Railway Time (latest build)
          prerelease: true
          body: "Latest build from ${{ github.ref_name }} @ ${{ github.sha }}. Download railwaytime.apk on your phone and install it."
          files: android/railwaytime.apk
