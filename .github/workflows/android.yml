name: Android APK

# Builds the PixTime Android app on every push that touches it. Pushes to main also
# publish the APK to the "android-latest" release, the link the app's Settings screen opens.
on:
  push:
    paths:
      - 'app/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        # PixTime.apk is the name now; RailwayTime.apk is kept as a copy so old links still get the latest build.
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PixTime.apk
          cp PixTime.apk RailwayTime.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PixTime-apk
          path: PixTime.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --title "PixTime for Android" --latest \
            --notes "Download **PixTime.apk** on your Android phone and open it to install (allow installs from your browser when asked). Alarms ring even when the app is closed. This release is rebuilt automatically from main."
          gh release upload android-latest PixTime.apk RailwayTime.apk --clobber
          gh release edit android-latest --title "PixTime for Android" --notes "Download **PixTime.apk** on your Android phone and open it to install (allow installs from your browser when asked). Alarms ring on a loop until you stop them, even when the app is closed. RailwayTime.apk is the same app under its old name. This release is rebuilt automatically from main."
